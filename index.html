<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14242a">
  <title>Runner</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #14242a; color: #efddac; font-family: system-ui, sans-serif; }
    #game { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; background: radial-gradient(ellipse at 50% 120%, #7a3524, #14242a 65%); padding: 30px; }
    #loading b { font-size: clamp(24px, 5vw, 54px); letter-spacing: -.04em; text-transform: uppercase; }
    #loading small { letter-spacing: .22em; margin: 20px 0; color: #5bd6c4; }
    progress { width: min(70vw, 460px); height: 5px; accent-color: #d53423; margin: 20px auto; }
    #status { max-width: 500px; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Яunner driving game"></canvas>
  <div id="loading"><small>KNOWN LIMIT / SECTOR 08</small><b>Establishing signal</b><progress id="progress" value="0" max="1"></progress><p id="status">Loading sector. Headphones recommended.</p></div>
  <script src="web-frame-audit.js?v=fps-20261015"></script>
  <script src="performance-diagnostics.js?v=fps-20261015"></script>
  <script src="texture-payloads.js?v=__RUNNER_BUILD__"></script>
  <script src="runtime-payloads.js?v=__RUNNER_BUILD__"></script>
  <script>
    const canvas = document.getElementById('game');
    const revision = window.runnerTexturePayloads?.revision || '__RUNNER_BUILD__';
    let dataUrl = window.runnerTexturePayloads?.dxt || 'Build/Web.data.unityweb';
    const probeCanvas = document.createElement('canvas');
    const probe = probeCanvas.getContext('webgl2');
    const supportsASTC = !!(probe && probe.getExtension('WEBGL_compressed_texture_astc'));
    if (supportsASTC && window.runnerTexturePayloads?.astc) {
      dataUrl = window.runnerTexturePayloads.astc;
    }
    window.runnerSelectedTexture = dataUrl === window.runnerTexturePayloads?.astc ? 'ASTC 4x4' : 'DXT';
    if (probe) probe.getExtension('WEBGL_lose_context')?.loseContext();
    const runtimes = window.runnerRuntimePayloads;
    const workersAvailable = window.crossOriginIsolated && typeof SharedArrayBuffer !== 'undefined';
    const requested = new URLSearchParams(location.search).get('runtime');
    // SharedArrayBuffer availability does not establish stable threaded Wasm on iOS.
    // The deployed iPhone test crashes in threaded startup and succeeds with identical
    // graphics/data in the single-thread runtime. Keep that verified path as default.
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const threaded = workersAvailable && requested !== 'single' && !!runtimes?.threaded &&
      (!isIOS || requested === 'threaded');
    window.runnerRuntimeReason = isIOS && requested !== 'threaded' ? 'iOS compatibility' :
      threaded ? 'native workers available' : 'compatible fallback';
    const engine = threaded ? runtimes.threaded : runtimes?.single;
    window.runnerRuntimeMode = threaded ? 'threaded' : 'single';
    const config = {
      dataUrl,
      frameworkUrl: engine?.framework || 'Build/Web.framework.js.unityweb?v=' + revision,
      codeUrl: engine?.code || 'Build/Web.wasm.unityweb?v=' + revision,
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'Known Limit',
      productName: 'Runner',
      productVersion: '0.1.1',
      devicePixelRatio: window.devicePixelRatio || 1,
      matchWebGLToCanvasSize: true
    };
    const loader = document.createElement('script');
    loader.src = engine?.loader || 'Build/Web.loader.js';
    loader.onerror = () => { document.getElementById('status').textContent = 'Could not load the game runtime.'; };
    loader.onload = () => createUnityInstance(canvas, config, progress => {
      document.getElementById('progress').value = progress;
    }).then(instance => {
      document.getElementById('loading').remove();
      canvas.focus();
      window.runnerPlayer = instance;
    }).catch(error => {
      document.getElementById('status').textContent = 'The signal could not connect: ' + error;
    });
    document.body.appendChild(loader);
    canvas.addEventListener('contextmenu', event => event.preventDefault());
  </script>
</body>
</html>
